[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-suite"
version = "0.1.0"
description = "Combined decision-tree and simulation library for teaching decision analysis"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "ipywidgets>=8.0",
]

[project.optional-dependencies]
examples = [
    "jupyter",
    "numpy_financial",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["decision_suite*"]
